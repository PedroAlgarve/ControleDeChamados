<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
      <ion-back-button defaultHref="/menu"></ion-back-button>
    </ion-buttons>
    <ion-title>Novo Chamado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card mode="ios">
    <ion-card-content>
      <ion-item lines="full">
        <ion-label position="floating">Solicitante *</ion-label>
        <ion-input type="text" [(ngModel)]="chamado.solicitante"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Setor</ion-label>
        <ion-input type="text" [(ngModel)]="chamado.setor"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Título do Problema *</ion-label>
        <ion-input type="text" [(ngModel)]="chamado.titulo"></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Descrição Detalhada *</ion-label>
        <ion-textarea rows="3" [(ngModel)]="chamado.descricao"></ion-textarea>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Prioridade *</ion-label>
        <ion-select [(ngModel)]="chamado.prioridade" placeholder="Selecione">
          <ion-select-option *ngFor="let p of prioridades" [value]="p">{{ p }}</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Técnico Responsável *</ion-label>
        <ion-select [(ngModel)]="chamado.tecnico" placeholder="Selecione um técnico">
          <ion-select-option *ngFor="let t of tecnicos" [value]="t.nome">
            {{ t.nome }} ({{ t.especialidade }})
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Data de Abertura</ion-label>
        <ion-datetime-button datetime="datetime"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="datetime" presentation="date" [(ngModel)]="chamado.dataAbertura"></ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>

      <ion-button expand="block" shape="round" color="primary" class="ion-margin-top" (click)="salvarChamado()">
        Registrar Chamado
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
